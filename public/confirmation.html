<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        />
        <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.3/dist/jquery.slim.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
        <link rel="stylesheet" href="/styles.css" />
        <title>Booking Confirmation</title>
    </head>
    <body>
        <div class="container pb-5">
            <header
                class="d-flex flex-wrap justify-content-between py-3 mb-5 border-bottom"
            >
                <a
                    href="/"
                    class="d-flex align-items-center mb-3 mb-md-0 me-md-auto link-body-emphasis text-decoration-none"
                >
                    <span class="logo">MyAirBnB</span>
                </a>

                <ul class="nav nav-pills">
                    <li class="nav-item">
                        <a href="/" class="nav-link" aria-current="page"
                            >Home</a
                        >
                    </li>
                </ul>
            </header>
            <div class="text-center d-flex justify-content-center flex-column">
                <h2 id="confirmation-message"></h2>
                <div
                    id="booking-details"
                    class="my-4 border border-black rounded rounded-3 pt-4 pb-2 px-5"
                ></div>
                <h4>
                    Thank you for booking with us! We can’t wait to welcome you!
                </h4>
                <a href="/" class="btn btn-primary mt-4">Return to Homepage</a>
            </div>
        </div>

        <script src="/confirmation.js"></script>
    </body>
</html>
