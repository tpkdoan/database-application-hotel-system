<!DOCTYPE html>
<html>
    <head>
        <title>Property Listings</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        />
        <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.3/dist/jquery.slim.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
        <link rel="stylesheet" href="/styles.css" />
    </head>
    <body>
        <div class="container pb-5">
            <header
                class="d-flex flex-wrap justify-content-between py-3 mb-5 border-bottom"
            >
                <a
                    href="/"
                    class="d-flex align-items-center mb-3 mb-md-0 me-md-auto link-body-emphasis text-decoration-none"
                >
                    <span class="logo">MyAirBnB</span>
                </a>

                <ul class="nav nav-pills">
                    <li class="nav-item">
                        <a href="/" class="nav-link active-page" aria-current="page"
                            >Home</a
                        >
                    </li>
                </ul>
            </header>

            <h1 class="mb-4">Property Listings</h1>

            <form id="searchForm" class="row" onsubmit="validateAndSearch(event)">
    <!-- Input group for location and selects -->
    <div class="input-group col-12 col-md-10 mb-2"> <!-- Full width on mobile, 8 columns on medium and larger screens -->
        <input
            type="text"
            id="location"
            class="form-control"
            placeholder="Enter location"
            required
        />
        <select id="propertyType" name="propertyType" class="form-control form-select">
            <option value="">Select Property Type</option>
        </select>
        <select id="bedrooms" name="bedrooms" class="form-control form-select">
            <option value="">Select Number of Bedrooms</option>
        </select>
    </div>

    <!-- Search button -->
    <div class="col-12 col-md-2 mb-2"> <!-- Full width on mobile, 4 columns on medium and larger screens -->
        <button type="submit" class="btn btn-dark w-100">Search</button> <!-- Full width button -->
    </div>
</form>


            <div class="d-flex flex-wrap justify-content-between my-3">
              <!-- Number of search result -->
                <p id="resultCount" class="font-weight-bold"></p>
                <!-- Show all listings -->
                <div id="showAllListings" class="link-underline-primary"></div>
            </div>

            <div id="data"></div>
            <nav>
                <ul id="pagination" class="pagination justify-content-end"></ul>
            </nav>
        </div>

        <script src="/index.js"></script>
    </body>
</html>
